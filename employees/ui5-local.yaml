# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: employees
type: application
framework:
  name: SAPUI5
  version: 1.147.2
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /v2/northwind/northwind.svc/
            url: https://services.odata.org/
            destination: Northwind
          - path: /sap/opu/odata/sap/ZEMPLOYEES_SRV/
            url: http://erp13.sap4practice.com:9037
            client: '001'
            destination: logaligroupERP
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /v2/northwind/northwind.svc
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/YSAPUI5_SRV_01
            metadataPath: ./webapp/localService/YSAPUI5_SRV_01/metadata.xml
            mockdataPath: ./webapp/localService/YSAPUI5_SRV_01/data
            generateMockData: true
          - urlPath: /sap/opu/odata/sap/ZEMPLOYEES_SRV
            metadataPath: ./webapp/localService/ZEMPLOYEES_SRV/metadata.xml
            mockdataPath: ./webapp/localService/ZEMPLOYEES_SRV/data
            generateMockData: true
        annotations: []
